version: '3.8'

services:
  frontend:
    build:
      context: ./react-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://backend:8080
    ports:
      - "4173:4173"
    depends_on:
      - backend

  backend:
    build:
      context: ./java-backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - db
      - fastapi
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/web_summarizer
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      FASTAPI_URL: http://fastapi:8000/summarize
      DB_URL: jdbc:postgresql://db:5432/web_summarizer
      DB_USER: postgres
      DB_PASSWORD: postgres

  fastapi:
    build:
      context: ./python-fastapi
    ports:
      - "8000:8000"
    env_file:
      - ./python-fastapi/.env

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: web_summarizer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

